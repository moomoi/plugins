# On a main push whose commits warrant a release (feat / fix / perf / BREAKING CHANGE), build every
# plugin for Apple silicon and Intel and publish a prerelease with moo-plugins.tar.gz attached.
# Moo pins a version (plugins.version in moomoi/moo) and downloads it instead of building plugins.
# macOS plugins come from the macOS job, Windows ones (moo-plugins-windows.tar.gz) from a Linux job.
#
#   version -> build (scripts/package.sh) -> release (sem tags vX.Y.Z, prerelease)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even without feat/fix commits: an exact version (1.0.0) or major / minor / patch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Next version via sem (dry run)
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          force: ${{ inputs.force }}
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip when there is no bump
        id: gate
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" != "true" ]; then
            echo "::notice::No version bump; nothing to build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.sem.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build every plugin (universal)
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Tish compiler and Lattish (npm)
        run: npm ci --no-audit --no-fund
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: moo-plugins
          path: dist/release/*
          if-no-files-found: error

  build-windows:
    name: Build every plugin (Windows x64)
    needs: version
    if: needs.version.outputs.publish == 'true'
    # Cross-built on Linux (cheaper than Windows): native plugins become DLLs through cargo-xwin.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XWIN_ACCEPT_LICENSE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Cross tools (LLVM, cargo-xwin)
        run: |
          sudo apt-get install -y clang lld llvm >/dev/null
          cargo install cargo-xwin --locked
      - name: Tish compiler and Lattish (npm)
        run: npm ci --no-audit --no-fund
      - name: Package
        run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: moo-plugins-windows
          path: dist/release/moo-plugins-windows.tar.gz
          if-no-files-found: error

  release:
    name: Prerelease
    needs: [version, build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: moo-plugins
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: moo-plugins-windows
          path: dist/release
      - name: Checksums for both tarballs
        run: cd dist/release && sha256sum moo-plugins.tar.gz moo-plugins-windows.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish the prerelease via sem
        uses: tishlang/sem@v1
        with:
          force: ${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
